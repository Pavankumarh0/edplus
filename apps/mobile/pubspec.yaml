name: eduplus
description: EduPlus AI — the student's own view of their progress.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase. The app reads ONLY the signed-in student's own documents, which
  # Firestore security rules enforce — there is no server in between.
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1

  intl: ^0.20.1

  # Planly runs server-side (it needs an API key), so the app calls it over
  # HTTP with its Firebase ID token.
  http: ^1.2.2

  # Opens a meeting link in the Meet app when it is installed, and in the
  # browser when it is not.
  url_launcher: ^6.3.1

  # Reads the assignment QR a mentor puts on the projector. There is always a
  # typed-code fallback, because a camera pointed at a bright screen fails
  # often enough that scanning cannot be the only way in.
  mobile_scanner: ^5.2.3

  # Asking for the camera explicitly, and sending someone to Settings when
  # they have already said no. Declaring the permission in the manifest is not
  # enough on Android 6+, and a denial is otherwise a dead end inside the app.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
