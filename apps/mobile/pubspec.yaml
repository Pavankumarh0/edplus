name: eduplus
description: EduPlus AI — the student's own view of their progress.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase. The app reads ONLY the signed-in student's own documents, which
  # Firestore security rules enforce — there is no server in between.
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.1

  intl: ^0.20.1

  # Planly runs server-side (it needs an API key), so the app calls it over
  # HTTP with its Firebase ID token.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
